[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allot"
version = "0.1.0"
description = "Distribute whole units in proportion to weights, with per-bucket floors and ceilings and an exact total."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Oliver Schwartz" }]
keywords = ["apportionment", "largest-remainder", "allocation", "rounding", "integer-partition"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/o-liverschwartz/allot"
Issues = "https://github.com/o-liverschwartz/allot/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["allot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
